services:
  init-config:
    image: python:3.13-alpine
    container_name: grok2api-init-config
    volumes:
      - ./data:/app/data
      - ./scripts:/scripts:ro
    environment:
      DATA_DIR: /app/data
      GROK_WARP_PROXY_URL: ${GROK_WARP_PROXY_URL:-http://privoxy:8118}
      GROK_FLARESOLVERR_URL: ${GROK_FLARESOLVERR_URL:-http://flaresolverr:8191}
      GROK_CLEARANCE_MODE: ${GROK_CLEARANCE_MODE:-flaresolverr}
      GROK_CF_REFRESH_INTERVAL: ${GROK_CF_REFRESH_INTERVAL:-3600}
      GROK_CF_TIMEOUT_SEC: ${GROK_CF_TIMEOUT_SEC:-60}
    command: ["python3", "/scripts/init_proxy_config.py"]
    restart: "no"

  warp-proxy:
    image: caomingjun/warp:latest
    container_name: warp-proxy
    restart: unless-stopped
    environment:
      WARP_SLEEP: "2"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"

  privoxy:
    build: ./docker/privoxy-warp
    image: grok2api-privoxy-warp:latest
    container_name: privoxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:40080:8118"
    depends_on:
      warp-proxy:
        condition: service_started

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8191:8191"

  grok2api:
    build: .
    image: grok2api-local:accountsdb-free-console-warp
    container_name: grok2api
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:${SERVER_PORT:-8000}"
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8000}
      SERVER_WORKERS: ${SERVER_WORKERS:-1}
      ACCOUNT_STORAGE: ${ACCOUNT_STORAGE:-local}
      ACCOUNT_LOCAL_PATH: ${ACCOUNT_LOCAL_PATH:-data/accounts.db}
      ACCOUNT_REDIS_URL: ${ACCOUNT_REDIS_URL:-}
      ACCOUNT_MYSQL_URL: ${ACCOUNT_MYSQL_URL:-}
      ACCOUNT_POSTGRESQL_URL: ${ACCOUNT_POSTGRESQL_URL:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      init-config:
        condition: service_completed_successfully
      warp-proxy:
        condition: service_started
      privoxy:
        condition: service_started
      flaresolverr:
        condition: service_started
